services:
  app:
    build: .
    container_name: symfony_app
    ports:
      - "8000:8000"
      - "8080:8080"
    volumes:
      - .:/app
    command: >
      sh -c "mkdir -p var &&
             touch var/app.db &&
             php bin/console doctrine:migrations:migrate --no-interaction &&
             php bin/console websocket:server > /var/log/workerman.log 2>&1 &
             symfony server:start --no-tls --port=8000 --listen-ip=0.0.0.0"